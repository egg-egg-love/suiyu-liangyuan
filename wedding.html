<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>穗遇良缘 · 新婚之喜</title>
<meta name="description" content="穗遇良缘 · 新婚之喜，谨订此日，敬备喜筵。">
<meta name="theme-color" content="#40070c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
    :root {
        --red-ink: #5b0b12;
        --red-deep: #40070c;
        --gold: #c9a06a;
        --gold-light: #efd7b0;
        --paper: #f9f2e6;
        --paper-edge: #f1e5d4;
        --muted: #8a6b4f;
        --body: #7b6149;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        min-height: 100vh;
        overflow-x: hidden;
        background-color: var(--red-deep);
        background-image:
            radial-gradient(circle at 50% -8%, rgba(217, 179, 130, .22), transparent 52%),
            radial-gradient(circle at 8% 105%, rgba(217, 179, 130, .13), transparent 42%),
            radial-gradient(circle at 96% 40%, rgba(142, 22, 30, .5), transparent 46%),
            linear-gradient(180deg, #4b080f 0%, #3a060b 55%, #2b0408 100%);
        background-attachment: fixed;
        color: var(--paper);
        font-family: 'ZCOOL XiaoWei', 'Songti SC', 'STSong', 'SimSun', serif;
        -webkit-font-smoothing: antialiased;
    }

    /* ---------- 飘落的花瓣 ---------- */
    .petals {
        position: fixed;
        inset: 0;
        z-index: 6;
        overflow: hidden;
        pointer-events: none;
    }

    .petals i {
        position: absolute;
        top: -6vh;
        display: block;
        background: linear-gradient(135deg, #f2ddbd, #c9a06a);
        border-radius: 62% 38% 55% 45% / 55% 62% 38% 45%;
        animation-name: petal-fall;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        will-change: transform;
    }

    @keyframes petal-fall {
        0% {
            transform: translate3d(0, -8vh, 0) rotate(0deg);
        }
        100% {
            transform: translate3d(46px, 112vh, 0) rotate(340deg);
        }
    }

    /* ---------- 主邀请卡 ---------- */
    .hero {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 46px 18px 64px;
    }

    .invite-card {
        position: relative;
        width: min(700px, 100%);
        padding: clamp(40px, 7vw, 70px) clamp(22px, 6vw, 62px);
        background: linear-gradient(180deg, #fdf8ef, var(--paper-edge));
        border-radius: 3px;
        box-shadow:
            0 34px 90px rgba(0, 0, 0, .5),
            0 0 0 1px rgba(201, 160, 106, .5);
        overflow: hidden;
    }

    .invite-card::before {
        content: '';
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(201, 160, 106, .5);
        pointer-events: none;
        z-index: 1;
    }

    .invite-card::after {
        content: '';
        position: absolute;
        inset: 17px;
        border: 1px solid rgba(201, 160, 106, .22);
        pointer-events: none;
        z-index: 1;
    }

    .corner {
        position: absolute;
        width: 24px;
        height: 24px;
        border: 2px solid rgba(201, 160, 106, .7);
        z-index: 2;
    }

    .corner.tl { top: 24px; left: 24px; border-right: 0; border-bottom: 0; }
    .corner.tr { top: 24px; right: 24px; border-left: 0; border-bottom: 0; }
    .corner.bl { bottom: 24px; left: 24px; border-right: 0; border-top: 0; }
    .corner.br { bottom: 24px; right: 24px; border-left: 0; border-top: 0; }

    .watermark {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Ma Shan Zheng', 'STKaiti', 'KaiTi', serif;
        font-size: clamp(210px, 46vw, 340px);
        line-height: 1;
        color: rgba(91, 11, 18, .055);
        user-select: none;
        pointer-events: none;
        z-index: 0;
    }

    .card-content {
        position: relative;
        z-index: 2;
        text-align: center;
    }

    .kicker {
        font-size: .72rem;
        letter-spacing: .55em;
        text-indent: .55em;
        color: #a5845f;
    }

    .kicker::before,
    .kicker::after {
        content: '';
        display: inline-block;
        width: 22px;
        height: 1px;
        vertical-align: middle;
        margin: 0 12px;
        background: linear-gradient(90deg, transparent, rgba(201, 160, 106, .9), transparent);
    }

    .names {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: .28em;
        margin-top: 26px;
        font-family: 'Ma Shan Zheng', 'STKaiti', 'KaiTi', serif;
        font-size: clamp(2.5rem, 8.4vw, 4.3rem);
        font-weight: 400;
        line-height: 1.16;
        color: var(--red-ink);
        letter-spacing: .04em;
        text-shadow: 0 2px 14px rgba(91, 11, 18, .12);
    }

    .names .dot {
        font-size: .44em;
        color: var(--gold);
        transform: translateY(-.12em);
    }

    .seal {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        margin: 24px auto 0;
        border: 1px solid rgba(91, 11, 18, .5);
        border-radius: 3px;
        background: var(--red-ink);
        color: var(--paper);
        font-family: 'Ma Shan Zheng', 'STKaiti', serif;
        font-size: 1.55rem;
        line-height: 1;
        transform: rotate(-6deg);
        box-shadow:
            0 0 0 3px rgba(249, 242, 230, .95),
            0 0 0 4px rgba(91, 11, 18, .22),
            0 8px 18px rgba(91, 11, 18, .22);
    }

    .date-line {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-top: 26px;
        font-size: .98rem;
        letter-spacing: .2em;
        text-indent: .2em;
        color: #6f4a37;
    }

    .date-line::before,
    .date-line::after {
        content: '';
        width: 40px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(201, 160, 106, .95), transparent);
    }

    .venue-line {
        margin-top: 14px;
        font-size: .95rem;
        letter-spacing: .14em;
        color: var(--muted);
        line-height: 1.8;
        word-break: break-word;
    }

    .invite-line {
        margin-top: 30px;
        font-size: .9rem;
        letter-spacing: .4em;
        text-indent: .4em;
        color: rgba(91, 11, 18, .72);
    }

    .scroll-hint {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        font-size: .72rem;
        letter-spacing: .3em;
        color: rgba(239, 215, 176, .62);
        animation: bob 2.4s ease-in-out infinite;
    }

    @keyframes bob {
        0%, 100% { transform: translate(-50%, 0); opacity: .55; }
        50% { transform: translate(-50%, 8px); opacity: 1; }
    }

    /* ---------- 内容面板 ---------- */
    main {
        position: relative;
        z-index: 2;
        width: min(820px, 100%);
        margin: 0 auto;
        padding: 10px 18px 0;
    }

    .panel {
        position: relative;
        margin: 26px 0;
        padding: clamp(30px, 5vw, 46px) clamp(22px, 5vw, 48px);
        background: linear-gradient(180deg, #fdf8ef, #f4e9d9);
        border: 1px solid rgba(201, 160, 106, .55);
        border-radius: 2px;
        box-shadow: 0 20px 55px rgba(0, 0, 0, .34);
    }

    .panel::after {
        content: '';
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(201, 160, 106, .22);
        pointer-events: none;
    }

    .panel h2 {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-bottom: 28px;
        font-size: 1.02rem;
        font-weight: 400;
        letter-spacing: .42em;
        text-indent: .42em;
        color: var(--red-ink);
    }

    .panel h2::before,
    .panel h2::after {
        content: '';
        width: 5px;
        height: 5px;
        background: var(--gold);
        transform: rotate(45deg);
        flex: 0 0 auto;
    }

    .info-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        text-align: center;
    }

    .info-item span {
        display: block;
        margin-bottom: 9px;
        font-size: .7rem;
        letter-spacing: .3em;
        text-indent: .3em;
        color: #a5845f;
    }

    .info-item strong {
        font-weight: 400;
        font-size: 1rem;
        line-height: 1.6;
        letter-spacing: .08em;
        color: var(--red-ink);
        word-break: break-word;
    }

    .info-item.wide {
        grid-column: 1 / -1;
        padding-top: 18px;
        border-top: 1px dashed rgba(201, 160, 106, .55);
    }

    .map-btn {
        display: block;
        margin: 26px auto 0;
        padding: 11px 34px;
        border: 1px solid var(--gold);
        border-radius: 999px;
        background: transparent;
        color: var(--red-ink);
        font-family: inherit;
        font-size: .86rem;
        letter-spacing: .3em;
        text-indent: .3em;
        cursor: pointer;
        transition: background .3s, color .3s, border-color .3s, box-shadow .3s;
    }

    .map-btn:hover {
        background: var(--red-ink);
        border-color: var(--red-ink);
        color: var(--gold-light);
        box-shadow: 0 10px 26px rgba(91, 11, 18, .28);
    }

    /* ---------- 婚礼流程 ---------- */
    .flow-list {
        list-style: none;
        width: min(560px, 100%);
        margin: 0 auto;
    }

    .flow-list li {
        position: relative;
        padding: 0 0 28px 30px;
        border-left: 1px solid rgba(201, 160, 106, .6);
    }

    .flow-list li:last-child {
        padding-bottom: 0;
        border-left-color: transparent;
    }

    .flow-list .dot {
        position: absolute;
        top: 7px;
        left: -4px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--red-ink);
        box-shadow: 0 0 0 4px rgba(201, 160, 106, .24);
    }

    .flow-list h3 {
        font-size: 1rem;
        font-weight: 400;
        letter-spacing: .26em;
        color: var(--red-ink);
    }

    .flow-list p {
        margin-top: 7px;
        font-size: .87rem;
        line-height: 1.95;
        letter-spacing: .05em;
        color: var(--body);
    }

    /* ---------- 寄语 ---------- */
    .quote {
        position: relative;
        z-index: 2;
        padding: 62px 24px 26px;
        text-align: center;
        color: var(--gold-light);
    }

    .quote p {
        font-family: 'Ma Shan Zheng', 'STKaiti', 'KaiTi', serif;
        font-size: clamp(1.25rem, 3.4vw, 1.75rem);
        line-height: 2.1;
        letter-spacing: .12em;
        text-shadow: 0 3px 22px rgba(0, 0, 0, .45);
    }

    .quote .xi {
        margin-top: 22px;
        font-family: 'Ma Shan Zheng', 'STKaiti', serif;
        font-size: 1.9rem;
        color: var(--gold);
        opacity: .62;
        letter-spacing: .4em;
        text-indent: .4em;
    }

    footer {
        position: relative;
        z-index: 2;
        padding: 14px 18px 44px;
        text-align: center;
        font-size: .76rem;
        letter-spacing: .26em;
        color: rgba(239, 215, 176, .55);
    }

    footer a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid rgba(239, 215, 176, .32);
        padding-bottom: 2px;
        transition: color .3s;
    }

    footer a:hover {
        color: var(--gold-light);
    }

    /* ---------- 入场动画 ---------- */
    .reveal {
        opacity: 0;
        transform: translateY(28px);
        transition: opacity .9s ease, transform .9s ease;
    }

    .reveal.in {
        opacity: 1;
        transform: none;
    }

    @media (max-width: 600px) {
        .hero {
            padding: 26px 12px 46px;
        }

        .invite-card {
            padding: 56px 20px 44px;
        }

        .corner {
            width: 18px;
            height: 18px;
        }

        .corner.tl, .corner.tr { top: 18px; }
        .corner.bl, .corner.br { bottom: 18px; }
        .corner.tl, .corner.bl { left: 18px; }
        .corner.tr, .corner.br { right: 18px; }

        .names {
            gap: .22em;
            font-size: 2.5rem;
        }

        .date-line {
            flex-wrap: wrap;
            gap: 6px;
            font-size: .82rem;
            letter-spacing: .05em;
            text-indent: 0;
            line-height: 1.9;
        }

        .date-line::before,
        .date-line::after {
            display: none;
        }

        .venue-line {
            font-size: .88rem;
        }

        .info-grid {
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .info-item span {
            margin-bottom: 6px;
        }

        .info-item.wide {
            padding-top: 16px;
        }

        main {
            padding: 4px 12px 0;
        }

        .panel {
            margin: 20px 0;
            padding: 32px 20px;
        }

        .quote p {
            font-size: 1.22rem;
        }

        footer {
            letter-spacing: .18em;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .petals,
        .scroll-hint {
            display: none;
        }

        .reveal {
            opacity: 1;
            transform: none;
            transition: none;
        }

        html {
            scroll-behavior: auto;
        }
    }
</style>
</head>
<body>

<div class="petals" aria-hidden="true"></div>

<header class="hero">
    <div class="invite-card">
        <span class="corner tl" aria-hidden="true"></span>
        <span class="corner tr" aria-hidden="true"></span>
        <span class="corner bl" aria-hidden="true"></span>
        <span class="corner br" aria-hidden="true"></span>
        <div class="watermark" aria-hidden="true">囍</div>

        <div class="card-content">
            <p class="kicker">新 婚 之 喜</p>
            <h1 class="names">
                <span id="groomName">新郎</span>
                <span class="dot">·</span>
                <span id="brideName">满穗</span>
            </h1>
            <div class="seal" aria-hidden="true">囍</div>
            <p class="date-line" id="weddingDate">—</p>
            <p class="venue-line" id="heroVenue">席设待定</p>
            <p class="invite-line">敬备喜筵 · 恭候光临</p>
        </div>
    </div>
    <div class="scroll-hint">向 下 滑 动</div>
</header>

<main>
    <section class="panel reveal">
        <h2>良 辰 吉 日</h2>
        <div class="info-grid">
            <div class="info-item">
                <span>日 期</span>
                <strong id="infoDate">—</strong>
            </div>
            <div class="info-item">
                <span>时 辰</span>
                <strong id="infoTime">—</strong>
            </div>
            <div class="info-item">
                <span>星 期</span>
                <strong id="infoWeek">—</strong>
            </div>
            <div class="info-item wide">
                <span>席 设</span>
                <strong id="infoVenue">待定</strong>
            </div>
        </div>
        <button class="map-btn" id="mapBtn" type="button">在 地 图 中 查 看</button>
    </section>

    <section class="panel reveal">
        <h2>婚 礼 流 程</h2>
        <ol class="flow-list">
            <li>
                <span class="dot" aria-hidden="true"></span>
                <h3>迎 亲</h3>
                <p>晨光初照，鼓乐相迎。执手同归，从此晨昏与共。</p>
            </li>
            <li>
                <span class="dot" aria-hidden="true"></span>
                <h3>典 礼</h3>
                <p>高堂在上，宾客在侧。一拜天地，二拜高堂，夫妻对拜。</p>
            </li>
            <li>
                <span class="dot" aria-hidden="true"></span>
                <h3>喜 宴</h3>
                <p>佳肴满席，举杯同庆。愿诸位尽兴而归，共沾喜气。</p>
            </li>
        </ol>
    </section>
</main>

<section class="quote reveal">
    <p>死生契阔，与子成说。<br>执子之手，与子偕老。</p>
    <div class="xi">囍</div>
</section>

<footer>
    穗遇良缘 · <a href="index.html">返回邀约</a>
</footer>

<script>
(function () {
    'use strict';

    var CN_DIGITS = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    var ZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
    var WEEK = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

    var groomName = document.getElementById('groomName');
    var brideName = document.getElementById('brideName');
    var weddingDate = document.getElementById('weddingDate');
    var heroVenue = document.getElementById('heroVenue');
    var infoDate = document.getElementById('infoDate');
    var infoTime = document.getElementById('infoTime');
    var infoWeek = document.getElementById('infoWeek');
    var infoVenue = document.getElementById('infoVenue');
    var mapBtn = document.getElementById('mapBtn');

    function readSaved(key, fallback) {
        var value = null;
        try {
            value = window.localStorage.getItem(key);
        } catch (e) {
            value = null;
        }
        return value && value.trim() ? value.trim() : fallback;
    }

    var groom = readSaved('suiyu_groom', '新郎');
    var bride = readSaved('suiyu_bride', '满穗');
    var venue = readSaved('suiyu_venue', '');

    groomName.textContent = groom;
    brideName.textContent = bride;
    document.title = groom + ' · ' + bride + ' · 新婚之喜';

    var venueText = venue || '席设待定';
    heroVenue.textContent = venueText;
    infoVenue.textContent = venueText;

    function cnYear(y) {
        return String(y).split('').map(function (d) { return CN_DIGITS[Number(d)]; }).join('');
    }

    function cnNumber(n) {
        if (n <= 9) return CN_DIGITS[n];
        if (n === 10) return '十';
        if (n < 20) return '十' + CN_DIGITS[n - 10];
        var tens = Math.floor(n / 10);
        var ones = n % 10;
        return CN_DIGITS[tens] + '十' + (ones ? CN_DIGITS[ones] : '');
    }

    function pad(n) {
        return n < 10 ? '0' + n : String(n);
    }

    function renderDate() {
        var now = new Date();
        var dateCN = cnYear(now.getFullYear()) + '年' + cnNumber(now.getMonth() + 1) + '月' + cnNumber(now.getDate()) + '日';
        var shichen = ZHI[Math.floor(((now.getHours() + 1) % 24) / 2)] + '时';

        weddingDate.textContent = dateCN + ' · ' + WEEK[now.getDay()];
        infoDate.textContent = dateCN;
        infoTime.textContent = shichen + ' · ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
        infoWeek.textContent = WEEK[now.getDay()];
    }

    renderDate();
    window.setInterval(renderDate, 1000);

    /* ---------- 地图 ---------- */
    if (mapBtn) {
        mapBtn.addEventListener('click', function () {
            if (!venue) {
                window.alert('还没有填写席设，返回邀约页填写后再来这里查看。');
                return;
            }
            var url = 'https://uri.amap.com/search?keyword=' + encodeURIComponent(venue) +
                      '&src=suiyu-liangyuan&coordinate=gaode&callnative=1';
            window.open(url, '_blank', 'noopener');
        });
    }

    /* ---------- 花瓣 ---------- */
    var petalLayer = document.querySelector('.petals');
    if (petalLayer && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        for (var i = 0; i < 16; i++) {
            var petal = document.createElement('i');
            var size = (6 + Math.random() * 7).toFixed(1);
            petal.style.left = (Math.random() * 100).toFixed(2) + '%';
            petal.style.width = size + 'px';
            petal.style.height = size + 'px';
            petal.style.opacity = (0.22 + Math.random() * 0.36).toFixed(2);
            petal.style.animationDuration = (10 + Math.random() * 9).toFixed(1) + 's';
            petal.style.animationDelay = (-Math.random() * 19).toFixed(1) + 's';
            petalLayer.appendChild(petal);
        }
    }

    /* ---------- 滚动入场 ---------- */
    var revealItems = Array.prototype.slice.call(document.querySelectorAll('.reveal'));

    if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add('in');
                    io.unobserve(entry.target);
                }
            });
        }, { threshold: 0.18 });

        revealItems.forEach(function (item) { io.observe(item); });
    } else {
        revealItems.forEach(function (item) { item.classList.add('in'); });
    }
})();
</script>

</body>
</html>
